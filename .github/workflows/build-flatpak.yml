name: Build Flatpak

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  build-flatpak:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder libgtk-3-dev ninja-build

      - name: Add Flathub repository
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak SDK and runtime
        run: |
          flatpak install --user -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Flutter Linux app
        run: flutter build linux --release

      - name: Build Flatpak
        run: |
          flatpak-builder --repo=repo --force-clean build-dir linux/de.lox.dev.camelus.yml

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle repo camelus.flatpak de.lox.dev.camelus

      - name: Upload Flatpak bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: camelus-flatpak
          path: camelus.flatpak
          retention-days: 30
