output: dist/
releases:
  - name: appstore
    jobs:
      - name: release-ios
        package:
          platform: ios
          target: ipa
          build_args:
            export-options-plist: ios/ExportOptions.plist
            dart-define-from-file: dart_defines.json
            obfuscate: true
            split-debug-info: build/ios/symbols
        publish:
          target: appstore
  - name: linux
    jobs:
      - name: release-linux-appimage
        package:
          platform: linux
          target: appimage
          build_args:
            dart-define-from-file: dart_defines.json
  - name: windows-exe
    jobs:
      - name: release-windows-exe
        package:
          platform: windows
          target: exe
          build_args:
            dart-define-from-file: dart_defines.json
        # publish:
        #   target: github

  - name: windows-msix
    jobs:
      - name: release-windows-msix
        package:
          platform: windows
          target: msix
          build_args:
            dart-define-from-file: dart_defines.json
