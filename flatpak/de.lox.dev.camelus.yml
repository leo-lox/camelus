app-id: de.lox.dev.camelus
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
command: camelus

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri

modules:
  - name: camelus
    buildsystem: simple
    build-commands:
      - cp -r bundle /app/camelus
      - chmod +x /app/camelus/camelus
      - mkdir -p /app/bin
      - ln -s /app/camelus/camelus /app/bin/camelus
      - install -Dm644 icon.png /app/share/icons/hicolor/512x512/apps/de.lox.dev.camelus.png
      - install -Dm644 de.lox.dev.camelus.desktop /app/share/applications/de.lox.dev.camelus.desktop
      - install -Dm644 de.lox.dev.camelus.metainfo.xml /app/share/metainfo/de.lox.dev.camelus.metainfo.xml
    sources:
      - type: dir
        path: ../build/linux/x64/release/
      - type: file
        path: icon.png
      - type: file
        path: de.lox.dev.camelus.desktop
      - type: file
        path: de.lox.dev.camelus.metainfo.xml
