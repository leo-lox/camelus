name: apipod_server
description: Starting point for a Serverpod server.
# version: 1.0.0
# homepage: https://www.example.com

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  serverpod: 2.5.1
  ndk: ^0.1.3
  dart_firebase_admin: ^0.4.1
  web_socket_channel: ^3.0.2
  http: ^1.3.0

dev_dependencies:
  lints: '>=3.0.0 <6.0.0'
  test: '^1.24.2'
  serverpod_test: 2.5.1

dependency_overrides:
  ndk:
    #path: ../../../ndk/packages/ndk
     git:
       url: https://github.com/relaystr/ndk.git
       path: packages/ndk
       ref: nip-59-gift-wrap