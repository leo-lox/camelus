services:
  # Development services
  postgres:
    image: postgres:16.3
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: apipod
      POSTGRES_PASSWORD: "DlVe-VwelYBWJqMkW0OZ0BgOrc78jGBy"
    volumes:
      - apipod_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "8Y5RaeSZ7FPxim7hABzTT9I2y31VZAE2"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: postgres:16.3
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: apipod_test
      POSTGRES_PASSWORD: "R1-XQAQArRXvskp-ZBboBHjjnrIRe9Q7"
    volumes:
      - apipod_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "bRcK_k-R4lPz4lnIP8elpTOa-Z75Bduq"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  apipod_data:
  apipod_test_data:
